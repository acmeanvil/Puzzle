# Puzzle's cross-platform environments (ADR 0013), from one lock file, on Linux,
# macOS (Intel and Apple silicon) and Windows.
#
# Puzzle itself runs in `default` / `dev` / `full`. Each native solver gets its own
# environment, because solvers run as separate processes (ADR 0007) and their
# dependencies clash if solved together (e.g. FEniCSx and Code_Aster need different
# MPI builds on Windows). Solvers conda-forge doesn't package (Elmer for now,
# Code_Saturne) run in containers; see containers/.
#
#   pixi run test                 unit tests
#   pixi run -e dev check         lint, format check, all tests incl. native solver runs
#   pixi install -e calculix      install one native solver
#   pixi shell -e dev             a shell with Puzzle; dev puts the solver envs on PUZZLE_SOLVER_PATH

[workspace]
name = "puzzle"
channels = ["conda-forge"]
# osx-64 (Intel Macs) is supported for now; reassess as Apple ends Intel support.
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pydantic = ">=2.7"
pint = ">=0.24"
tomli-w = ">=1.0"
python-gmsh = ">=4.13"
numpy = ">=1.26"
deltalake = ">=1.0"
pyarrow = ">=16"
pyvista = ">=0.44"
mcp = ">=2.0,<3"
ocp = ">=8.0"  # OpenCASCADE bindings; the same conda-forge occt as gmsh (ADR 0004)
ezdxf = ">=1.1"  # DXF profiles for extrude and revolve (ADR 0014)

[pypi-dependencies]
puzzle-fem = { path = ".", editable = true }
py-slvs = ">=1.0.6"  # SolveSpace's constraint solver for sketches (ADR 0014, G5); not on conda-forge

[tasks]
test = "pytest"

[feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"
openpyxl = ">=3.1"

[feature.dev.tasks]
lint = "ruff check . && ruff format --check ."
install-solvers = "pixi install -e calculix && pixi install -e fenicsx && pixi install -e netgen"
check = { cmd = "pytest", depends-on = ["lint", "install-solvers"] }
import-materials = "python scripts/import_materials.py"

[feature.dev.target.unix.activation.env]
PUZZLE_SOLVER_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/calculix/bin:$PIXI_PROJECT_ROOT/.pixi/envs/fenicsx/bin:$PIXI_PROJECT_ROOT/.pixi/envs/code-aster/bin:$PIXI_PROJECT_ROOT/.pixi/envs/netgen/bin"

[feature.dev.target.win.activation.env]
PUZZLE_SOLVER_PATH = "%PIXI_PROJECT_ROOT%\\.pixi\\envs\\calculix\\Library\\bin;%PIXI_PROJECT_ROOT%\\.pixi\\envs\\fenicsx;%PIXI_PROJECT_ROOT%\\.pixi\\envs\\code-aster\\Library\\bin;%PIXI_PROJECT_ROOT%\\.pixi\\envs\\netgen"

[feature.gui.dependencies]
pyside6 = ">=6.7"
pyvista = ">=0.44"
anthropic = ">=0.40"  # the built-in agent's Claude provider
keyring = ">=25"  # API keys in the OS keychain

# One feature per native solver.
[feature.calculix.dependencies]
calculix = "2.23.*"

[feature.fenicsx.dependencies]
python = "3.12.*"
fenics-dolfinx = "0.11.*"
python-gmsh = ">=4.13"  # dolfinx reads Gmsh meshes through it
scipy = ">=1.11"  # solver backend where PETSc is missing (Windows)

# Netgen, the second mesher (ADR 0019): its own OpenCASCADE bindings clash with OCP's in
# one process, so it runs in its own environment, as a solver does.
[feature.netgen.dependencies]
python = "3.12.*"
netgen = ">=6.2.2601"
numpy = ">=1.26"

[feature.code-aster]
platforms = ["linux-64", "win-64"]

[feature.code-aster.dependencies]
code-aster = "18.1.*"

[environments]
default = { solve-group = "main" }
dev = { features = ["dev", "gui"], solve-group = "main" }
full = { features = ["dev", "gui"], solve-group = "main" }
calculix = { features = ["calculix"], no-default-feature = true }
fenicsx = { features = ["fenicsx"], no-default-feature = true }
code-aster = { features = ["code-aster"], no-default-feature = true }
netgen = { features = ["netgen"], no-default-feature = true }
