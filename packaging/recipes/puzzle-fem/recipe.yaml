# Puzzle itself (ADR 0068): pure Python, so one noarch package for every platform. Its
# run requirements are pixi.toml's default and gui features, kept in step by
# tests/test_packaging.py.
context:
  name: puzzle-fem
  # scripts/build_packages.py sets it from pyproject.toml
  version: ${{ env.get("PUZZLE_VERSION", default="0.0.0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../..
  use_gitignore: true

build:
  number: ${{ env.get("PUZZLE_BUILD", default="0") | int }}  # CI's run number
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    # The Start-menu, Dock or desktop entry the installer makes (menuinst, ADR 0068),
    # copied by Python so the recipe builds on Windows too
    - ${{ PYTHON }} packaging/recipes/puzzle-fem/install_menu.py
  python:
    entry_points:
      - puzzle = puzzle.cli:main

requirements:
  host:
    - python 3.12.*
    - pip
    - hatchling >=1.25
  run:
    - python 3.12.*
    # pixi.toml [dependencies]
    - pydantic >=2.7
    - pint >=0.24
    - tomli-w >=1.0
    - python-gmsh >=4.13
    - numpy >=1.26
    - scipy >=1.11
    - deltalake >=1.0
    - pyarrow >=16
    - pyvista >=0.44
    - mcp >=2.0,<3
    - ocp >=8.0
    - ezdxf >=1.1
    - h5py >=3.10
    - polars >=1.0
    - xlsxwriter >=3.0
    # pixi.toml [pypi-dependencies], from Puzzle's channel
    - py-slvs >=1.0.6
    - manifold3d >=3.0
    # pixi.toml [feature.gui.dependencies]
    - pyside6 >=6.7
    - anthropic >=0.40
    - keyring >=25
    - paraview >=6.2
    - vtk-base ==9.7.0 *_0  # the build ParaView 6.2's libraries link (ADR 0070)

tests:
  - python:
      imports:
        - puzzle
        - puzzle.runner
        - puzzle.commands
      pip_check: false
  - script:
      - puzzle --help
      # Python, not test -f, so the test runs on Windows too
      - python -c "import os, sys; assert os.path.isfile(os.path.join(sys.prefix, 'Menu', 'puzzle-fem.json'))"
      - python -c "import puzzle.gui.theme, py_slvs.slvs, manifold3d, OCP; print('ok')"

about:
  homepage: https://github.com/acmeanvil/Puzzle
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Open-source multi-solver FEM/CFD pre- and post-processor
