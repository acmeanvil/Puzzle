# Variants for Puzzle's own packages (ADR 0068): the Python Puzzle runs on, and what
# conda-forge's global pinning would give (compilers, the C library, the macOS SDK).
python:
  - "3.12"
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs
c_stdlib_version:
  - if: linux
    then: "2.17"
  - if: osx and x86_64
    then: "11.0"  # libc++ warns below 11 (an error under -Werror); Qt 6.11 needs 12
  - if: osx and arm64
    then: "11.0"
  - if: win
    then: "2022"
c_compiler:
  - if: linux
    then: gcc
  - if: osx
    then: clang
  - if: win
    then: vs2022
cxx_compiler:
  - if: linux
    then: gxx
  - if: osx
    then: clangxx
  - if: win
    then: vs2022
