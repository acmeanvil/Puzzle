# Local builds only: values conda-forge's global pinning normally provides.
# Not part of a staged-recipes submission.
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.17"
  - if: osx and x86_64
    then: "10.13"
  - if: osx and arm64
    then: "11.0"
c_compiler:
  - if: linux
    then: gcc
  - if: osx
    then: clang
cxx_compiler:
  - if: linux
    then: gxx
  - if: osx
    then: clangxx
fortran_compiler:
  - gfortran
