name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  platforms:
    # Lint, unit tests and native CalculiX runs on every supported platform (ADR 0013).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev calculix fenicsx
      - run: pixi run -e dev check

  pip:
    # Plain pip installs keep working on the oldest and newest supported Pythons.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - run: pip install -e ".[dev]"
      - run: pytest
