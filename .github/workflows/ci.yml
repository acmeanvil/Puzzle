name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  solvers:
    # Integration tests against real solver binaries from conda-forge (same pins as the images).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: solvers
          create-args: python=3.12 calculix=2.23 gmsh=4.15
          channels: conda-forge
      - shell: bash -el {0}
        run: |
          pip install -e ".[dev]"
          pytest tests/integration -rs
