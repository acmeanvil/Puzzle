name: Installers

# Puzzle's installers (ADR 0068, step 3): one per platform from pixi.lock, each installed
# and smoke-tested on its own system (scripts/smoke_installer.py solves the cantilever
# with the installed CalculiX). Run by hand for a test build (the installers are this
# run's artifacts), and on a published release, which gets them as assets.
#
# Signing switches on by itself once the certificates are secrets:
#   macOS: MAC_CERTIFICATES_P12 (base64 .p12 holding the Developer ID Installer and
#     Application identities), MAC_CERTIFICATES_PASSWORD, MAC_INSTALLER_IDENTITY,
#     MAC_APP_IDENTITY; notarized with APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
#   Windows: WIN_CERTIFICATE_PFX (base64 .pfx) and WIN_CERTIFICATE_PASSWORD.
# Without them the installers are unsigned test builds.

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main, development]
    paths:
      - pixi.lock
      - scripts/make_installer.py
      - scripts/smoke_installer.py
      - packaging/recipes/puzzle-fem/**
      - .github/workflows/installers.yml

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Puzzle itself from this commit (noarch, so built once); py-slvs and manifold3d come
  # from the published channel.
  puzzle-fem:
    runs-on: ubuntu-latest
    env:
      PUZZLE_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: packaging
      - run: pixi run -e packaging build-packages --output output --only puzzle-fem
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-fem
          path: output/noarch/puzzle-fem-*.conda
          if-no-files-found: error

  installer:
    needs: puzzle-fem
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-64, kind: sh }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, kind: sh }
          - { os: macos-15-intel, platform: osx-64, kind: pkg }
          - { os: macos-latest, platform: osx-arm64, kind: pkg }
          - { os: windows-latest, platform: win-64, kind: exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write  # attaching to a release
    env:
      SIGN_MAC: ${{ secrets.MAC_CERTIFICATES_P12 != '' && matrix.kind == 'pkg' }}
      NOTARIZE: ${{ secrets.APPLE_APP_PASSWORD != '' && secrets.MAC_CERTIFICATES_P12 != '' && matrix.kind == 'pkg' }}
      SIGN_WIN: ${{ secrets.WIN_CERTIFICATE_PFX != '' && matrix.kind == 'exe' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Room on the disk (an installer and its install are several GB)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: packaging
      - uses: actions/download-artifact@v4
        with:
          name: puzzle-fem
          path: output/noarch
      - name: Index the local channel
        run: pixi run -e packaging rattler-index fs output

      - name: Signing identities into a keychain (macOS)
        if: env.SIGN_MAC == 'true'
        env:
          P12: ${{ secrets.MAC_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/puzzle.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certs.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certs.p12"
          echo "PUZZLE_MAC_INSTALLER_IDENTITY=${{ secrets.MAC_INSTALLER_IDENTITY }}" >> "$GITHUB_ENV"
          echo "PUZZLE_MAC_APP_IDENTITY=${{ secrets.MAC_APP_IDENTITY }}" >> "$GITHUB_ENV"
      - name: Signing certificate (Windows)
        if: env.SIGN_WIN == 'true'
        env:
          PFX: ${{ secrets.WIN_CERTIFICATE_PFX }}
        run: |
          echo "$PFX" | base64 --decode > "$RUNNER_TEMP/puzzle.pfx"
          signtool="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)"
          {
            echo "PUZZLE_WIN_CERTIFICATE=$(cygpath -w "$RUNNER_TEMP/puzzle.pfx")"
            echo "CONSTRUCTOR_SIGNTOOL_PATH=$(cygpath -w "$signtool")"
            echo "CONSTRUCTOR_SIGNTOOL_TIMESTAMP_SERVER_URL=http://timestamp.digicert.com"
            echo "CONSTRUCTOR_PFX_CERTIFICATE_PASSWORD=${{ secrets.WIN_CERTIFICATE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build the installer
        run: pixi run -e packaging make-installer --packages output --build

      - name: Notarize and staple (macOS)
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          pkg=$(ls packaging/installer/Puzzle-*.pkg)
          xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 2h
          xcrun stapler staple "$pkg"
          spctl --assess --type install -vv "$pkg"
      - name: Check the signature (Windows)
        if: env.SIGN_WIN == 'true'
        run: '"$(cygpath -u "$CONSTRUCTOR_SIGNTOOL_PATH")" verify -pa -v packaging/installer/Puzzle-*.exe'

      - name: Smoke test (install, solve the cantilever, each solver environment)
        run: pixi run -e packaging python scripts/smoke_installer.py packaging/installer/Puzzle-*.${{ matrix.kind }}
      - name: Checksum
        working-directory: packaging/installer
        run: |
          for f in Puzzle-*.${{ matrix.kind }}; do
            pixi run --manifest-path ../../pixi.toml -e packaging python -c "import hashlib, sys; p = sys.argv[1]; print(hashlib.file_digest(open(p, 'rb'), 'sha256').hexdigest(), ' ', p)" "$f" > "$f.sha256"
            cat "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            packaging/installer/Puzzle-*.${{ matrix.kind }}
            packaging/installer/Puzzle-*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}" --clobber
          packaging/installer/Puzzle-*.${{ matrix.kind }} packaging/installer/Puzzle-*.sha256
