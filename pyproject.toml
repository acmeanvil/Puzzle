[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "puzzle-fem"
version = "0.0.1"
description = "Open-source multi-solver FEM/CFD pre- and post-processor"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "acmeanvil" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7",
    "pint>=0.24",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
geometry = ["cadquery-ocp>=7.7", "build123d>=0.8"]
mesh = ["gmsh>=4.13", "meshio>=5.3"]
results = ["deltalake>=0.20", "pyarrow>=16"]
gui = ["PySide6>=6.7", "pyvista>=0.44", "pyvistaqt>=0.11"]
dev = ["pytest>=8", "ruff>=0.6"]
tools = ["openpyxl>=3.1"]

# Solver adapters register here; third-party packages can add their own.
[project.entry-points."puzzle.adapters"]
calculix = "puzzle.adapters.calculix:CalculixAdapter"
elmer = "puzzle.adapters.elmer:ElmerAdapter"
code_aster = "puzzle.adapters.code_aster:CodeAsterAdapter"
fenicsx = "puzzle.adapters.fenicsx:FenicsxAdapter"
code_saturne = "puzzle.adapters.code_saturne:CodeSaturneAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
