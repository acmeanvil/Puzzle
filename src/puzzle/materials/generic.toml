# Puzzle's built-in generic materials.
#
# Typical room-temperature (about 20 °C) values for common engineering materials,
# from general engineering references, meant as starting points. Check them against
# your supplier's data before relying on a result. Adding one to a project copies it;
# the copy never changes when this file does.
#
# A fuller library (temperature tables, sources) can be generated from your own data
# with scripts/import_materials.py into your user library; see puzzle.materials.
#
# Property names are the ones adapters read. Units must parse with pint.

[structural_steel]
name = "Structural steel"
description = "Generic carbon structural steel (e.g. S235 to S355). Room values and tables from the EN 1993-1-2 carbon steel formulas"
sources = ["EN 1993-1-2:2005 (Eurocode 3 Part 1-2), clause 3.4 and Table 3.1: carbon steel thermal and mechanical properties at elevated temperature"]
density = { value = 7850, unit = "kg/m^3" }
youngs_modulus = { value = 210, unit = "GPa" }
poissons_ratio = { value = 0.30 }
thermal_conductivity = { value = 53.33, unit = "W/(m*K)" }
specific_heat = { value = 439.8, unit = "J/(kg*K)" }
thermal_expansion = { value = 12.16e-6, unit = "1/K" }
electrical_conductivity = { value = 5.9e6, unit = "S/m" }
relative_permeability = { value = 1.0 }  # treated as non-magnetic; use electrical_steel for magnetic cores

# EN 1993-1-2: E(T) = 210 GPa x k_E (Table 3.1); conductivity 54 - 0.0333 T(°C);
# specific heat by clause 3.4.1.2 (its peak near 735 °C is the phase change);
# mean expansion from 20 °C from the elongation formula of clause 3.4.1.1.
[structural_steel.tables.youngs_modulus]
unit = "Pa"
points = [[293.15, 210e9], [373.15, 210e9], [473.15, 189e9], [573.15, 168e9], [673.15, 147e9],
          [773.15, 126e9], [873.15, 65.1e9], [973.15, 27.3e9], [1073.15, 18.9e9]]

[structural_steel.tables.thermal_conductivity]
unit = "W/(m*K)"
points = [[293.15, 53.33], [373.15, 50.67], [473.15, 47.34], [573.15, 44.01], [673.15, 40.68],
          [773.15, 37.35], [873.15, 34.02], [973.15, 30.69], [1073.15, 27.36]]

[structural_steel.tables.specific_heat]
unit = "J/(kg*K)"
points = [[293.15, 439.8], [373.15, 487.6], [473.15, 529.8], [573.15, 564.7], [673.15, 605.9],
          [773.15, 666.5], [873.15, 760.2], [973.15, 1008.2], [1073.15, 803.3]]

[structural_steel.tables.thermal_expansion]
unit = "1/K"
reference_temperature = 293.15
points = [[293.15, 12.16e-6], [373.15, 12.48e-6], [473.15, 12.88e-6], [573.15, 13.28e-6],
          [673.15, 13.68e-6], [773.15, 14.08e-6], [873.15, 14.48e-6], [973.15, 14.88e-6]]

