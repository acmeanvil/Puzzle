# Puzzle's built-in default materials library.
#
# Typical room-temperature (about 20 °C) values for common engineering materials,
# meant as starting points. Check them against your supplier's data before relying
# on a result. Adding one to a project copies it; the copy never changes when this
# file does.
#
# Property names are the ones adapters read. Units must parse with pint.

[structural_steel]
name = "Structural steel"
description = "Generic carbon structural steel"
density = { value = 7850, unit = "kg/m^3" }
youngs_modulus = { value = 200, unit = "GPa" }
poissons_ratio = { value = 0.30 }
thermal_conductivity = { value = 60.5, unit = "W/(m*K)" }
specific_heat = { value = 434, unit = "J/(kg*K)" }
thermal_expansion = { value = 12e-6, unit = "1/K" }
electrical_conductivity = { value = 5.9e6, unit = "S/m" }

